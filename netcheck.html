<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f2b9b4" />
  <title>DriftLight · connection check</title>
  <style>
    :root { --ink: #5e3f4c; --soft: #8a6a76; --ok: #4f8a5b; --bad: #b4505a; --wait: #b98a3c; --card: #fff6ec; --bg: #f6dccf; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 18px) 16px 40px; }
    h1 { font-size: 24px; margin: 0 0 4px; }
    .sub { color: var(--soft); font-size: 14px; margin: 0 0 16px; }
    #verdict { background: var(--card); border-radius: 16px; padding: 14px 16px; font-size: 17px; font-weight: 700; line-height: 1.35; margin-bottom: 14px; box-shadow: 0 2px 10px rgba(150, 90, 100, 0.12); }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
    li { background: var(--card); border-radius: 14px; padding: 10px 14px; display: grid; grid-template-columns: 26px 1fr; column-gap: 8px; align-items: start; }
    li .i { font-size: 18px; line-height: 1.3; text-align: center; }
    li .t { font-weight: 700; font-size: 15px; }
    li .n { grid-column: 2; color: var(--soft); font-size: 13px; margin-top: 2px; word-break: break-word; }
    li.ok .i { color: var(--ok); } li.bad .i { color: var(--bad); } li.wait .i { color: var(--wait); }
    .foot { color: var(--soft); font-size: 13px; margin-top: 16px; }
    button { font: inherit; font-weight: 700; color: var(--ink); background: #ffe2a8; border: 0; border-radius: 999px; padding: 10px 20px; margin-top: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Connection check</h1>
    <p class="sub">Open this on both phones and send a screenshot of each. It checks every step two players need to find each other.</p>
    <div id="verdict">Checking…</div>
    <ul id="rows"></ul>
    <button id="again">Check again</button>
    <p class="foot" id="foot"></p>
  </main>
  <script type="module" src="./src/netcheck.js"></script>
</body>
</html>
