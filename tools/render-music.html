<!doctype html><meta charset="utf-8"><body>
<script type="module">
// Offline render of one generated piano piece (for listening / level checks): window.__render(seed)
import { PianoMusic, compose } from '../src/music.js';
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
window.__render = async (seed) => {
  const piece = compose(mulberry(seed));
  const sr = 32000, len = Math.ceil((piece.length + 4) * sr);
  const ctx = new OfflineAudioContext(2, len, sr);
  const music = ctx.createGain(); music.gain.value = 0.75;
  const rev = ctx.createConvolver();
  const n = sr * 2.8, ir = ctx.createBuffer(2, n, sr);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3); }
  rev.buffer = ir;
  const wet = ctx.createGain(); wet.gain.value = 0.45 * 1.4;
  const comp = ctx.createDynamicsCompressor();
  music.connect(comp); music.connect(rev); rev.connect(wet).connect(comp); comp.connect(ctx.destination);
  const p = new PianoMusic(ctx, music);
  for (const e of piece.events) p.note(e.midi, e.t + 0.3, e.vel, e.dur);
  const buf = await ctx.startRendering();
  const L = buf.getChannelData(0), R = buf.getChannelData(1);
  let peak = 0, sum = 0;
  const pcm = new Int16Array(L.length * 2);
  for (let i = 0; i < L.length; i++) { peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i])); sum += L[i] * L[i]; pcm[2 * i] = Math.max(-1, Math.min(1, L[i])) * 32767; pcm[2 * i + 1] = Math.max(-1, Math.min(1, R[i])) * 32767; }
  const bytes = new Uint8Array(pcm.buffer);
  let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return { peak, rms: Math.sqrt(sum / L.length), secs: piece.length, notes: piece.events.length, sr, pcm: btoa(bin) };
};
window.__ok = true;
</script>
